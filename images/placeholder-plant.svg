<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg-plant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D82"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg-plant)"/>
  <!-- Oil platform silhouette -->
  <rect x="160" y="120" width="80" height="60" fill="rgba(255,255,255,0.3)"/>
  <rect x="175" y="90" width="50" height="30" fill="rgba(255,255,255,0.35)"/>
  <rect x="190" y="60" width="20" height="30" fill="rgba(255,255,255,0.4)"/>
  <!-- Crane -->
  <rect x="145" y="100" width="8" height="80" fill="rgba(255,255,255,0.25)"/>
  <rect x="145" y="100" width="40" height="5" fill="rgba(255,255,255,0.25)"/>
  <!-- Derrick -->
  <path d="M250 180 L270 80 L290 180" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="3"/>
  <rect x="265" y="80" width="10" height="100" fill="rgba(255,255,255,0.2)"/>
  <!-- Analytics dashboard overlay -->
  <rect x="40" y="30" width="100" height="70" rx="6" fill="rgba(255,255,255,0.95)" stroke="#003D82" stroke-width="2"/>
  <!-- Health indicators -->
  <circle cx="60" cy="50" r="12" fill="#10B981" opacity="0.9"/>
  <text x="60" y="54" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="white">OK</text>
  <circle cx="95" cy="50" r="12" fill="#F59E0B" opacity="0.9"/>
  <text x="95" y="54" text-anchor="middle" font-family="Poppins, sans-serif" font-size="8" font-weight="700" fill="white">!</text>
  <circle cx="120" cy="50" r="8" fill="#EF4444" opacity="0.8"/>
  <!-- Chart lines -->
  <path d="M50 75 L60 70 L75 78 L90 65 L105 72 L120 60 L130 68" stroke="#003D82" fill="none" stroke-width="2"/>
  <path d="M50 85 L65 82 L80 88 L95 80 L110 84 L125 78 L130 82" stroke="#00C7B1" fill="none" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Prediction arrow -->
  <rect x="300" y="40" width="70" height="50" rx="4" fill="rgba(255,255,255,0.9)" stroke="#FF6B35" stroke-width="2"/>
  <text x="335" y="58" text-anchor="middle" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#003D82">PREDICT</text>
  <path d="M315 72 L325 68 L335 75 L345 62 L355 70" stroke="#FF6B35" fill="none" stroke-width="2"/>
  <path d="M355 70 L360 65" stroke="#FF6B35" fill="none" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Sensor dots on platform -->
  <circle cx="175" cy="130" r="4" fill="#10B981"/>
  <circle cx="195" cy="140" r="4" fill="#10B981"/>
  <circle cx="215" cy="125" r="4" fill="#F59E0B"/>
  <circle cx="230" cy="145" r="4" fill="#10B981"/>
</svg>
